<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Setup Modal -->
    <div id="setup-modal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Premium Tic Tac Toe</h2>
            <div class="input-group mode-selection">
                <label>Game Mode:</label>
                <div class="mode-toggle">
                    <input type="radio" id="mode-local" name="game-mode" value="local" checked>
                    <label for="mode-local" class="mode-label">Local (2 Players)</label>

                    <input type="radio" id="mode-bot" name="game-mode" value="bot">
                    <label for="mode-bot" class="mode-label">Vs Bot</label>
                </div>
            </div>
            <div class="input-group">
                <label for="player-x">Player X Name:</label>
                <input type="text" id="player-x" placeholder="Enter name" value="Player X">
            </div>
            <div class="input-group" id="player-o-container">
                <label for="player-o">Player O Name:</label>
                <input type="text" id="player-o" placeholder="Enter name" value="Player O">
            </div>
            <div class="input-group" id="bot-difficulty-container" style="display:none;">
                <label for="bot-difficulty">Bot Difficulty:</label>
                <select id="bot-difficulty" style="width: 100%; padding: 0.8rem 1rem; border: 2px solid #eee; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 1rem;">
                    <option value="easy">Easy</option>
                    <option value="hard">Hard</option>
                    <option value="extreme">Extreme</option>
                </select>
            </div>
            <button id="start-game-btn" class="primary-btn">Start Game</button>
        </div>
    </div>

    <!-- Main Game Container -->
    <div class="container" id="game-container" style="display: none;">
        <div class="header">


        <div class="header-controls">
            <button id="voice-toggle-btn" class="icon-btn" aria-label="Toggle Voice" title="Voice Off">
                <span class="icon">🔇</span>
            </button>
        </div>

        <div class="dialogue-container" id="dialogue-container">
            <div class="dialogue-text" id="dialogue-text"></div>
        </div>

            <h1>Tic Tac Toe</h1>
            <div class="scores">
                <div class="score-badge" id="score-x">
                    <span class="player-name" id="name-display-x">Player X</span>: <span id="points-x">0</span>
                </div>
                <div class="score-badge" id="score-o">
                    <span class="player-name" id="name-display-o">Player O</span>: <span id="points-o">0</span>
                </div>
            </div>
        </div>
        
        <div class="status" id="status">Player X's turn</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="controls">
            <button class="secondary-btn" id="reset-btn">Restart Match</button>
            <button class="secondary-btn" id="change-players-btn">Change Players</button>
        </div>
    </div>




    <!-- Result Modal -->
    <div id="result-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div id="result-icon" style="font-size: 4rem; margin-bottom: 1rem;">🏆</div>
            <h2 id="result-title">Player X WINS!</h2>
            <p id="result-message" style="margin-bottom: 2rem; font-size: 1.1rem; color: #495057;"></p>
            <div style="display: flex; gap: 1rem;">
                <button id="rematch-btn" class="primary-btn">🔄 Rematch</button>
                <button id="home-btn" class="secondary-btn">🏠 Home</button>
            </div>
        </div>
    </div>

    <!-- Container for floating emojis -->
    <div id="emoji-container"></div>

    <script src="script.js"></script>
</body>
</html>
